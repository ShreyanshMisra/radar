# Companies to watch. One line each.
#
#   name:   display name
#   ats:    hiring platform: greenhouse | ashby | lever | smartrecruiters | workday | oracle | amazon
#   token:  board id for greenhouse / ashby / lever / smartrecruiters (lever also takes `instance: eu`)
#   workday: {host, tenant, site} for Workday career sites
#   oracle:  {host, site} for Oracle Recruiting Cloud career sites
#   early_only: [us]   on very large boards, only read titles that say entry level in these regions
#
# Find a company's entry with:  python -m scout probe "Company Name"
# Every board here was verified to answer on 2026-11-16 (Workday sites throttle heavy use;
# a 429 shows up under "Search limitations" and the next run tries again). A board that stops answering is reported
# under "Search limitations" in each digest; remove or fix it here.

